[project]
name = "hiyal"
version = "0.0.1"
description = "Hiyal is an agentic tool. Currently it provides the LLM call component."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Okan Yenigün" }]
keywords = ["llm", "openai", "anthropic", "gemini", "ollama", "deepseek", "ai", "tool-calling", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=1.9.0",
    "docstring-parser>=0.18.0",
    "google-genai>=2.25.0",
    "ollama>=0.6.2",
    "openai>=3.22.1",
    "pydantic>=2.12",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/okanyenigun/hiyal"
Repository = "https://github.com/okanyenigun/hiyal"
Issues = "https://github.com/okanyenigun/hiyal/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiyal"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.ruff.lint]
# Only real errors: syntax errors, undefined names, unused imports and variables.
# Style rules (import order, modernisation, ...) are deliberately not enforced.
select = ["E4", "E7", "E9", "F"]
